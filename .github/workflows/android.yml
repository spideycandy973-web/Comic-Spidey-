name: Legacy WebView Android checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test movement model
        run: node --test tests/*.test.js
      - name: Browser smoke test
        run: |
          npm install --no-save --no-package-lock playwright-core@1.57.0
          python3 -m http.server 8000 --directory app/src/main/assets > /tmp/comic-server.log 2>&1 &
          node tests/browser-smoke.cjs
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: comic-spidey-prototype-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
