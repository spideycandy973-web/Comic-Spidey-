name: jMonkeyEngine Android compatibility check
on:
  push:
    branches: ['arena/a6af770e-comic-spidey']
    paths: ['engine-check/**', '.github/workflows/jme-evaluation.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android engine probe
        run: |
          gradle -p engine-check/jme assembleDebug
          find "$GITHUB_WORKSPACE" -name '*.apk' -print | while IFS= read -r line; do echo "::notice::Built APK: $line"; done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start native engine on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash engine-check/run-emulator.sh
