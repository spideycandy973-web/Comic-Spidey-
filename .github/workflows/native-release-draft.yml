# One-time preparation of the user's requested native APK. This job creates a
# DRAFT only; an operator must verify and privately back up the encrypted signing
# material before publishing. Never use the public transport key as a signing key.
name: Prepare native 0.4.0 release draft
on:
  push:
    branches: ['arena/0caf332d-comic-spidey']
permissions:
  contents: write
jobs:
  build:
    if: contains(github.event.head_commit.message, '[prepare-native-0.4.0]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af9daaa48def44afdac08fd134c5a02f9b16bf01
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Refuse to replace a published or populated release
        run: |
          gh release view v0.4.0-native --json isDraft,targetCommitish,assets --jq '.isDraft == true and .targetCommitish == "af9daaa48def44afdac08fd134c5a02f9b16bf01" and (.assets | length == 0)' | grep -qx true
      - name: Install Godot and Android export template
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.zip
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable ~/.config/godot
          unzip -q /tmp/templates.zip -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres
      - name: Build and verify non-debug APK and encrypted key backup
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          export RELEASE_PASSWORD=$(openssl rand -hex 32)
          printf '%s' "$RELEASE_PASSWORD" > "$dir/password.txt"
          keytool -genkeypair -keystore "$dir/release.p12" -storetype PKCS12 -alias comicspidey -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Comic Spidey Android Release' -storepass:env RELEASE_PASSWORD -keypass:env RELEASE_PASSWORD >/dev/null 2>&1
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$dir/release.p12"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=comicspidey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$RELEASE_PASSWORD"
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --import --quit
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --export-release Android /tmp/Comic-Spidey-0.4.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/Comic-Spidey-0.4.0.apk | tee /tmp/signature.txt
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/signature.txt)
          test ${#cert} -eq 64
          echo "::notice::COMIC_CERT_SHA256=$cert"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging /tmp/Comic-Spidey-0.4.0.apk > /tmp/badging.txt
          grep -q "package: name='com.comicspidey.nativegame' versionCode='2' versionName='0.4.0'" /tmp/badging.txt
          if grep -q '^application-debuggable' /tmp/badging.txt; then echo '::error::APK is debuggable'; exit 1; fi
          echo "::notice::COMIC_APK_SHA256=$(sha256sum /tmp/Comic-Spidey-0.4.0.apk | cut -d' ' -f1)"
          # Encrypt the key AND its password to the owner's offline recovery
          # public key. Only ciphertext is recorded in the public Actions log.
          cat > "$dir/transport-public.pem" <<'PUBLICKEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAv4bbvVDmzh0jz+uVwXSy
          vWSJUQ0OCjEzf0aN9iY58W1nFzGYAMYKLmUg6Tu9AYZURp1sWh3ZciP1tca6L/ba
          zaDP/P4mFREfHIeXJuzKL/gZij6RRic83pG4OOMDKDeHrYaAmQh9LusvyclLQQU3
          bnEdV/9orQtm0IUnIIxfhTBN7g79aX8lclvmPTTQocOA0+bi8ZO7c3izaKWD25bx
          kwZNceqxqNDpoeI/3/XeNCy7ZHIezTjjwI7p0sbcSZTDGkH13zW1kwolb7m+1TW3
          jirLZC1mPyYCVLLZymv+u+jqdbtNUvC2C14kqRMPWK43RXCpwqHCiL4IH7mOwn30
          EcJ5bmmHXx5qwQ2wsH8FSbIqORnjg5nLwkEi1VaE2Juioufrl3rYQ6ia7h6xeCj1
          9VIaGJhWfqDFNdgYbjgilTVe00uJ72VPc5vBLC9VUMmZQcaJphpYasw5Bs6Vi/68
          hDLvden9JfJw0IDxUpRoW2X995nFnKSPUh+X368Y5dPXPcvFA8T5Ae1XbHjkUSH6
          MjCFmU0EwknpyFwCeZcnk6sp4ScsPHYR+Gqm+848RgiYiz1DarRQdhBAm35Yn+oe
          jxF2i/wo+RkV/TRmQ7YYMVAgwQqBueMEoNgp2gHD5BPLTTG3MHMIEoSC+P4Pxm5f
          pVaEbROn40he8TW4V1IpPpsCAwEAAQ==
          -----END PUBLIC KEY-----
          PUBLICKEY
          tar -C "$dir" -cf "$dir/backup.tar" release.p12 password.txt
          openssl rand -hex 32 > "$dir/envelope-pass.txt"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$dir/backup.tar" -out "$dir/backup.enc" -pass "file:$dir/envelope-pass.txt"
          openssl pkeyutl -encrypt -pubin -inkey "$dir/transport-public.pem" -in "$dir/envelope-pass.txt" -out "$dir/envelope.enc" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          echo "::notice::COMIC_ENVELOPE=$(base64 -w0 "$dir/envelope.enc")"
          base64 -w0 "$dir/backup.enc" > "$dir/backup.b64"
          # GitHub truncates annotations at 4096 characters, so chunk them.
          split -b 3000 -d -a 3 "$dir/backup.b64" "$dir/chunk-"
          for chunk in "$dir"/chunk-*; do
            echo "::notice::COMIC_BACKUP_$(basename "$chunk" | cut -d- -f2)=$(cat "$chunk")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: comic-spidey-0.4.0-candidate
          path: /tmp/Comic-Spidey-0.4.0.apk
          retention-days: 2
          if-no-files-found: error
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af9daaa48def44afdac08fd134c5a02f9b16bf01
      - uses: actions/download-artifact@v4
        with:
          name: comic-spidey-0.4.0-candidate
          path: /tmp/native-release
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test signed release on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash godot/tests/android-release-smoke.sh /tmp/native-release/Comic-Spidey-0.4.0.apk
      - name: Upload tested APK to the draft only
        run: |
          gh release view v0.4.0-native --json isDraft,targetCommitish,assets --jq '.isDraft == true and .targetCommitish == "af9daaa48def44afdac08fd134c5a02f9b16bf01" and (.assets | length == 0)' | grep -qx true
          gh release upload v0.4.0-native /tmp/native-release/Comic-Spidey-0.4.0.apk
