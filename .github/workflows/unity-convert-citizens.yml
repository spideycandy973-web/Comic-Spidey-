name: Convert supplied citizen models for Unity
on:
  workflow_dispatch:
  push:
    branches: ['arena/fcf116e2-comic-spidey']
    paths:
      - 'unity/tools/export_citizens.py'
      - '.github/workflows/unity-convert-citizens.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/fcf116e2-comic-spidey
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless Blender library
        run: python -m pip install 'numpy<2' 'bpy==4.2.0'
      - name: Convert and verify character rigs and clips
        run: |
          set +e
          python -u -X faulthandler unity/tools/export_citizens.py > /tmp/citizen-conversion.log 2>&1
          result=$?
          cat /tmp/citizen-conversion.log
          if [ "$result" -ne 0 ]; then
            detail=$(tail -c 3000 /tmp/citizen-conversion.log | tr '\n' ' ')
            echo "::error::Citizen conversion failed ($result): $detail"
            exit "$result"
          fi
      - name: Commit generated models only to this branch if unchanged
        shell: bash
        run: |
          set -euo pipefail
          branch=arena/fcf116e2-comic-spidey
          git fetch origin "$branch"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$branch")" ]; then
            echo 'Branch changed during conversion; refusing to push.'
            exit 1
          fi
          git add unity/ComicSpidey/Assets/Resources/Citizens/citizen.fbx unity/ComicSpidey/Assets/Resources/Citizens/citizen2.fbx
          if git diff --cached --quiet; then
            echo 'Generated models are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Convert generated pedestrian rigs for Unity'
          git push origin HEAD:refs/heads/arena/fcf116e2-comic-spidey
