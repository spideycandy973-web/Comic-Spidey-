name: Unity engine-independent story logic
on:
  push:
    branches: ['arena/fcf116e2-comic-spidey']
    paths:
      - 'unity/**'
      - '.github/workflows/unity-logic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test engine-independent story rules
        run: dotnet run --project unity/tests/StoryLogic/StoryLogic.csproj --configuration Release
  hero-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect hero FBX and texture (not a Unity test)
        working-directory: unity/tests/asset-check
        run: |
          npm ci --no-audit --no-fund
          npm test
